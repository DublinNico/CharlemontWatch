name: Keep Render Instance Warm

# Render's free tier spins the backend down after ~15 min of inactivity, and
# the next request pays a 50s+ cold-start penalty. UptimeRobot is meant to
# ping /api/health often enough to prevent that, but on 2026-07-22 it left a
# ~36-minute gap between checks (cause unconfirmed), long enough for the
# instance to sleep and the next check to catch a 502. This is an
# independent second ping source — even if UptimeRobot skips a beat, this
# runs on its own schedule so a single gap on one side doesn't leave the
# instance unmonitored/asleep.
#
# 2026-08-26: pinging around the clock kept the instance awake 24/7, which
# burned through Render's 750 free instance-hours/month almost by itself
# (615/750 used by day 26). Ping is now paused 00:00-06:00 UTC so the
# instance can actually sleep overnight and claw back headroom; the tradeoff
# is a cold start on the first request during that window. If UptimeRobot
# is still pinging every few minutes through the night, it will keep the
# instance awake regardless — pause or widen its interval for the same
# window to actually see the hour savings.
on:
  schedule:
    - cron: '*/20 6-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-22.04
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 60 https://charlemontwatch.onrender.com/api/health
