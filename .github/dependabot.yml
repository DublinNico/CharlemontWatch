# Opens fix PRs for vulnerable or outdated dependencies, so new security
# advisories arrive as a ready-made update instead of a red CI audit step.
# Minor and patch bumps are grouped into one PR per folder to keep noise down;
# major versions still come one at a time since they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
