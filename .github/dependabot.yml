# Security updates only. Dependabot opens a fix PR when a dependency has a
# known vulnerability, so new advisories arrive as a ready-made update instead
# of a red CI audit step. Routine version updates are switched off with
# open-pull-requests-limit: 0, which leaves security updates working.
# Security updates also need "Dependabot security updates" turned on under
# the repo's Settings > Code security. They always target main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
