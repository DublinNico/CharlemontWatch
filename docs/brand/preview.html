<!doctype html>
<html><head><meta charset="utf-8"><title>Charlemont Watch logo</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#eceeea;color:#16181a}
  .wrap{width:1200px;padding:40px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .p{border-radius:18px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:200px}
  .l{background:#f6f7f5;border:1px solid #dcdfdb}.d{background:#16181a}
  .wide{grid-column:span 2}
  .icons{display:flex;gap:28px;align-items:end}
  .icons img{display:block}
  .hdr{grid-column:span 2;background:#fff;border:1px solid #dcdfdb;border-radius:14px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
  .hdr nav{display:flex;gap:26px;font-size:15px;color:#4a4f54}
  .btn{background:#1d4ed8;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px}
</style></head>
<body><div class="wrap">
  <div class="hdr"><img src="logo-horizontal-light.svg" height="34"><nav><span>Incidents</span><span>Track</span><span>About</span><span class="btn">Report an issue</span></nav></div>
  <div class="p l"><img src="logo-horizontal-light.svg" width="440"></div>
  <div class="p d"><img src="logo-horizontal-dark.svg" width="440"></div>
  <div class="p l"><img src="logo-stacked-light.svg" width="300"></div>
  <div class="p d"><img src="logo-stacked-dark.svg" width="300"></div>
  <div class="p l wide"><div class="icons">
    <img src="icon.svg" width="128"><img src="icon.svg" width="64"><img src="icon-small.svg" width="32"><img src="icon-small.svg" width="16">
    <img src="mark-light.svg" height="96" style="margin-left:40px">
  </div></div>
</div></body></html>
